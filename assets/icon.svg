<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3C8CE8"/>
      <stop offset="1" stop-color="#1D4FAF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8ECFF"/>
      <stop offset="1" stop-color="#A6CFFA"/>
    </linearGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF1F5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B2A66" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <!-- window frame and glass -->
    <rect x="112" y="92" width="288" height="312" rx="14" fill="#FFFFFF"/>
    <rect x="132" y="112" width="248" height="272" rx="6" fill="url(#glass)"/>
    <rect x="251" y="112" width="10" height="272" fill="#FFFFFF"/>
    <rect x="132" y="243" width="248" height="10" fill="#FFFFFF"/>

    <!-- shade fabric with honeycomb pleats, lowered halfway -->
    <rect x="122" y="100" width="268" height="170" fill="url(#fabric)"/>
    <g stroke="#C9CFD8" stroke-width="5" stroke-linecap="round">
      <line x1="134" y1="126" x2="378" y2="126"/>
      <line x1="134" y1="150" x2="378" y2="150"/>
      <line x1="134" y1="174" x2="378" y2="174"/>
      <line x1="134" y1="198" x2="378" y2="198"/>
      <line x1="134" y1="222" x2="378" y2="222"/>
      <line x1="134" y1="246" x2="378" y2="246"/>
    </g>

    <!-- headrail with status light, bottom rail, sill -->
    <rect x="98" y="72" width="316" height="36" rx="10" fill="#3D4552"/>
    <circle cx="384" cy="90" r="7" fill="#4FC3FF"/>
    <rect x="116" y="262" width="280" height="16" rx="8" fill="#3D4552"/>
    <rect x="92" y="398" width="328" height="22" rx="8" fill="#3D4552"/>
  </g>
</svg>
